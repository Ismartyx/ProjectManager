<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت پروژه‌ها</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body>

    <header class="app-header">
        <h1 id="header-title">تسک منیجر مکاو</h1>
        <button id="btnLogout" style="display: none;" class="btn btn-secondary btn-small">خروج</button>
    </header>

    <main id="app-container">
        <!-- بخش ورود: حالا به جای تایپ، کاربر اسمش را انتخاب می‌کند -->
        <div id="login-view" class="view-section">
            <div class="card login-card">
                <h2>ورود به سیستم</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">لطفاً نام خود را از لیست زیر انتخاب کنید:</p>
                
                <select id="userSelect">
                    <option value="" disabled selected>انتخاب کاربر...</option>
                    <option value="ali">علی (مدیر پروژه)</option>
                    <option value="reza">رضا (فنی)</option>
                    <option value="milad">میلاد (تدارکات)</option>
                </select>
                
                <button id="btnLogin" class="btn btn-primary">ورود به حساب</button>
            </div>
        </div>

        <!-- بخش جزئیات تسک -->
        <div id="task-view" class="view-section" style="display: none;">
            <div class="card task-details">
                <span class="tag">فاز اجرا / نصب</span>
                <h2 id="task-title">ساخت و مونتاژ نمونه اولیه</h2>
                <div class="task-info-row">
                    <span>مسئول انجام:</span>
                    <span id="task-assignee" class="highlight">علی</span>
                </div>
                <div class="task-info-row">
                    <span>تاریخ ثبت:</span>
                    <span>۱۴۰۵/۰۷/۱۸</span>
                </div>
            </div>

            <!-- فرم ثبت گزارش -->
            <div class="report-form card">
                <textarea id="reportText" placeholder="متن گزارش کار یا نظر خود را اینجا بنویسید..."></textarea>
                <div class="action-buttons">
                    <button id="btnSubmitComment" class="btn btn-secondary">ثبت گزارش روزانه</button>
                    <button id="btnSubmitFinal" class="btn btn-success" style="display: none;">تکمیل و بستن تسک</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/db/adapter-pouch.js"></script>
    <script src="js/db/adapter-fire.js"></script>
    <script src="js/db/db-manager.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
