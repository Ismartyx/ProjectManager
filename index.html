<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیریت کارهای مکاو</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1 id="header-title">مدیریت کارهای مکاو</h1>
        <div class="header-actions" id="headerActions" style="display: none;">
            <button id="btnSettings" class="icon-btn">⚙️</button>
            <button id="btnLogout" class="btn btn-secondary btn-small" style="margin: 0;">خروج</button>
        </div>
    </header>

    <main id="app-container">
        <!-- فرم ورود -->
        <div id="login-view" class="view-section">
            <div class="card">
                <h2>ورود به حساب</h2>
                <input type="text" id="personnelCodeInput" placeholder="کد پرسنلی" inputmode="numeric" />
                <input type="password" id="nationalCodeInput" placeholder="رمز عبور" />
                <button id="btnLogin" class="btn btn-primary">ورود</button>
            </div>
        </div>

        <!-- داشبورد -->
        <div id="dashboard-view" class="view-section" style="display: none;">
            <div id="admin-notifications" class="card" style="display: none; border-color: var(--danger);">
                <h3 style="color: var(--danger); margin:0 0 10px 0;">⚠️ درخواست‌های ارجاع</h3>
                <div id="transfer-requests-list"></div>
            </div>
            <div id="tasks-list-container"></div>
        </div>

        <!-- تنظیمات -->
        <div id="settings-view" class="view-section" style="display: none;">
            <button id="btnBackToDashboard" class="btn btn-secondary btn-small" style="margin-bottom: 15px;">بازگشت ➔</button>
            <div class="card">
                <h3>تغییر رمز من</h3>
                <input type="password" id="myNewPassword" placeholder="رمز جدید..." />
                <button id="btnChangeMyPass" class="btn btn-primary">ثبت</button>
            </div>
            <div id="admin-settings-section" style="display: none;">
                <div class="card">
                    <h2>پرسنل سیستم</h2>
                    <div id="admin-users-list-container" style="max-height: 150px; overflow-y: auto; font-size: 0.9rem;"></div>
                </div>
                <div class="card">
                    <h2>تعریف کاربر جدید</h2>
                    <input type="text" id="newUserName" placeholder="نام کامل" />
                    <input type="text" id="newUserCode" placeholder="کد پرسنلی" inputmode="numeric" />
                    <input type="password" id="newUserNatCode" placeholder="رمز اولیه" inputmode="numeric" />
                    <label style="display: flex; gap: 8px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px;">
                        <input type="checkbox" id="newUserCanAssign"> این شخص بتواند تسک ارجاع دهد
                    </label>
                    <button id="btnAddUser" class="btn btn-success">ثبت</button>
                </div>
            </div>
        </div>
    </main>

    <button id="fabAdd" class="fab" style="display: none;">+</button>

    <!-- مودال ایجاد -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <h2 style="margin:0;">آیتم جدید</h2>
                <button id="btnCloseModal" class="icon-btn" style="color:red;">✕</button>
            </div>
            <div class="modal-tabs">
                <button id="tabProject" class="tab-btn active">پروژه</button>
                <button id="tabTask" class="tab-btn">تسک</button>
            </div>
            <div id="formProject">
                <input type="text" id="projTitle" placeholder="عنوان پروژه..." />
                <textarea id="projDesc" placeholder="توضیحات..."></textarea>
                <button id="btnSaveProject" class="btn btn-primary">ثبت پروژه</button>
            </div>
            <div id="formTask" style="display: none;">
                <div class="custom-select-wrapper" id="taskProjectSelectWrapper">
                    <div class="custom-select"><span class="select-text">پروژه...</span><span style="font-size: 0.7rem;">▼</span></div>
                    <div class="custom-options"></div>
                </div>
                <input type="text" id="taskTitle" placeholder="عنوان تسک..." />
                <div id="advancedTaskOptions">
                    <div class="custom-select-wrapper" id="taskAssigneeSelectWrapper">
                        <div class="custom-select"><span class="select-text">مسئول انجام...</span><span style="font-size: 0.7rem;">▼</span></div>
                        <div class="custom-options"></div>
                    </div>
                    <div class="custom-select-wrapper" id="taskFinalizerSelectWrapper">
                        <div class="custom-select"><span class="select-text">مسئول نهایی...</span><span style="font-size: 0.7rem;">▼</span></div>
                        <div class="custom-options"></div>
                    </div>
                </div>
                <div class="custom-select-wrapper" id="taskTagSelectWrapper">
                    <div class="custom-select"><span class="select-text">تگ...</span><span style="font-size: 0.7rem;">▼</span></div>
                    <div class="custom-options"></div>
                </div>
                <div style="display: flex; gap: 8px; margin-bottom: 10px;">
                    <input type="text" id="newTagInput" placeholder="تگ جدید..." style="margin:0;" />
                    <button id="btnAddCustomTag" class="btn btn-secondary btn-small">افزودن</button>
                </div>
                <label id="globalTagLabel" style="display: none; gap: 8px; font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px;">
                    <input type="checkbox" id="chkGlobalTag"> تگ برای همه
                </label>
                <button id="btnSaveTask" class="btn btn-primary">ثبت تسک</button>
            </div>
        </div>
    </div>

    <!-- مودال جزئیات و چت -->
    <div id="taskDetailModal" class="modal-overlay">
        <div class="modal-content card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <h2 id="td-title" style="margin:0; font-size: 1.1rem;"></h2>
                <button id="btnCloseTaskDetail" class="icon-btn" style="color:red;">✕</button>
            </div>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; display:flex; justify-content:space-between;">
                <span id="td-status"></span>
                <span>مسئول: <b id="td-assignee" style="color:white;"></b></span>
            </div>
            
            <div id="td-reports-list" class="chat-container"></div>
            
            <div id="td-action-form">
                <input type="file" id="reportImageInput" accept="image/*" style="display: none;" />
                <div id="reportAttachmentPreview" style="margin-bottom: 8px;"></div>
                
                <textarea id="td-new-report" placeholder="پیام، گزارش یا لینک..." style="min-height: 60px; margin-bottom: 8px;"></textarea>
                
                <div style="display: flex; gap: 8px;">
                    <button id="btnAttachImage" class="btn btn-secondary" style="width: 45px; margin:0;" title="عکس">📷</button>
                    <button id="btnSubmitComment" class="btn btn-primary" style="margin:0;">ارسال</button>
                </div>
                <button id="btnSubmitFinal" class="btn btn-success" style="display: none; margin-top: 8px;">تایید نهایی و بستن تسک</button>
            </div>
            
            <div id="transferSection" style="display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
                <p style="font-size: 0.85rem; color:#94a3b8; margin: 0 0 8px 0;">ارجاع به:</p>
                <div class="custom-select-wrapper" id="transferUserSelectWrapper">
                    <div class="custom-select"><span class="select-text">شخص جدید...</span><span style="font-size: 0.7rem;">▼</span></div>
                    <div class="custom-options"></div>
                </div>
                <button id="btnRequestTransfer" class="btn btn-secondary btn-small" style="width: 100%;">درخواست ارجاع</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/config.js"></script>
    <script src="js/db/adapter-pouch.js"></script>
    <script src="js/db/adapter-fire.js"></script>
    <script src="js/db/db-manager.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
