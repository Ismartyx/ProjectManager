<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسک منیجر مکاو</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body>

    <header class="app-header">
        <h1 id="header-title">تسک منیجر</h1>
        <button id="btnLogout" style="display: none;" class="btn btn-secondary btn-small">خروج</button>
    </header>

    <main id="app-container">
        
        <!-- فرم ورود -->
        <div id="login-view" class="view-section">
            <div class="card login-card">
                <h2>ورود به حساب کاربری</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">برای اولین بار با نام کاربری admin و رمز admin وارد شوید.</p>
                
                <input type="text" id="personnelCodeInput" placeholder="کد پرسنلی" inputmode="numeric" />
                <input type="password" id="nationalCodeInput" placeholder="کد ملی (رمز عبور)" />
                
                <button id="btnLogin" class="btn btn-primary">ورود</button>
            </div>
        </div>

        <!-- پنل مدیریت (فقط برای مدیر) -->
        <div id="admin-view" class="view-section" style="display: none;">
            
            <div class="card">
                <h2>تعریف پرسنل جدید</h2>
                <input type="text" id="newUserName" placeholder="نام و نام خانوادگی" />
                <input type="text" id="newUserCode" placeholder="کد پرسنلی" inputmode="numeric" />
                <input type="password" id="newUserNatCode" placeholder="کد ملی (به عنوان رمز اولیه)" inputmode="numeric" />
                <button id="btnAddUser" class="btn btn-success">ثبت کاربر در سیستم</button>
            </div>

            <div class="card">
                <h2>تغییر رمز پرسنل</h2>
                <p style="color: var(--text-muted); font-size: 0.8rem;">مدیر می‌تواند رمز هر کاربری را بازنشانی کند.</p>
                <input type="text" id="targetUserCode" placeholder="کد پرسنلی شخص مورد نظر" inputmode="numeric" />
                <input type="password" id="targetNewPassword" placeholder="رمز عبور جدید" />
                <button id="btnAdminChangePass" class="btn btn-secondary">تغییر رمز کاربر</button>
            </div>
        </div>

        <!-- داشبورد کاربری (تغییر رمز شخصی) -->
        <div id="task-view" class="view-section" style="display: none;">
            <div class="card">
                <h2 id="task-title">خوش آمدید، <span id="welcomeName" class="highlight"></span></h2>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
                
                <h3>تغییر رمز عبور من</h3>
                <input type="password" id="myNewPassword" placeholder="رمز عبور جدید خود را وارد کنید..." />
                <button id="btnChangeMyPass" class="btn btn-primary">ثبت رمز جدید</button>
            </div>
        </div>

    </main>

    <div id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/db/adapter-pouch.js"></script>
    <script src="js/db/adapter-fire.js"></script>
    <script src="js/db/db-manager.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
