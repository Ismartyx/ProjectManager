<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تسک منیجر مکاو</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body>

    <header class="app-header">
        <h1 id="header-title">تسک منیجر</h1>
        <button id="btnLogout" style="display: none;" class="btn btn-secondary btn-small">خروج</button>
    </header>

    <main id="app-container">
        
        <!-- فرم ورود کاملا اپلیکیشنی (بدون دراپ‌داون) -->
        <div id="login-view" class="view-section">
            <div class="card login-card">
                <h2>ورود به حساب کاربری</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">برای اولین بار با نام کاربری admin و رمز admin وارد شوید.</p>
                
                <input type="text" id="personnelCodeInput" placeholder="کد پرسنلی (مثبت 1001)" inputmode="numeric" />
                <input type="password" id="nationalCodeInput" placeholder="کد ملی (رمز عبور)" inputmode="numeric" />
                
                <button id="btnLogin" class="btn btn-primary">ورود</button>
            </div>
        </div>

        <!-- پنل مدیریت کاربران (فقط برای مدیر) -->
        <div id="admin-view" class="view-section" style="display: none;">
            <div class="card">
                <h2>تعریف پرسنل جدید</h2>
                <input type="text" id="newUserName" placeholder="نام و نام خانوادگی" />
                <input type="text" id="newUserCode" placeholder="کد پرسنلی" inputmode="numeric" />
                <input type="text" id="newUserNatCode" placeholder="کد ملی" inputmode="numeric" />
                <button id="btnAddUser" class="btn btn-success">ثبت کاربر در سیستم</button>
            </div>
        </div>

        <!-- بخش تسک‌ها (برای تست) -->
        <div id="task-view" class="view-section" style="display: none;">
            <div class="card">
                <span class="tag">تست</span>
                <h2 id="task-title">شما با موفقیت وارد شدید!</h2>
                <p>نام شما: <span id="welcomeName" class="highlight"></span></p>
                <!-- این بخش در مرحله بعد با لیست پروژه‌ها جایگزین می‌شود -->
            </div>
        </div>

    </main>

    <!-- کانتینر پیام‌های شناور -->
    <div id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/db/adapter-pouch.js"></script>
    <script src="js/db/adapter-fire.js"></script>
    <script src="js/db/db-manager.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
