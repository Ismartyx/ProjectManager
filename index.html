<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProjectManager - مکاو</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@8.0.1/dist/pouchdb.min.js"></script>
</head>
<body>

    <header class="app-header">
        <h1 id="header-title">مدیریت کارهای مکاو</h1>
        <div class="header-actions" id="headerActions" style="display: none;">
            <!-- دکمه تنظیمات (چرخ‌دنده) -->
            <button id="btnSettings" class="icon-btn" title="تنظیمات">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
            <button id="btnLogout" class="btn btn-secondary btn-small" style="margin-bottom: 0;">خروج</button>
        </div>
    </header>

    <main id="app-container">
        
        <!-- فرم ورود -->
        <div id="login-view" class="view-section">
            <div class="card login-card">
                <h2>ورود به حساب کاربری</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">کد پرسنلی و رمز عبور خود را وارد کنید.</p>
                <input type="text" id="personnelCodeInput" placeholder="کد پرسنلی" inputmode="numeric" />
                <input type="password" id="nationalCodeInput" placeholder="رمز عبور" />
                <button id="btnLogin" class="btn btn-primary">ورود</button>
            </div>
        </div>

        <!-- داشبورد اصلی (لیست تسک‌ها) -->
        <div id="dashboard-view" class="view-section" style="display: none;">
            <div class="card">
                <h2>خوش آمدید، <span id="welcomeName" class="highlight"></span></h2>
                <p style="color: var(--text-muted); font-size: 0.9rem;">تسک‌های مرتبط با شما:</p>
            </div>
            
            <div id="tasks-list-container">
                <!-- این بخش در مرحله بعد با تسک‌های دیتابیس پر می‌شود -->
                <div class="card empty-state">
                    <p>در حال حاضر تسک فعالی برای شما وجود ندارد.</p>
                </div>
            </div>
        </div>

        <!-- صفحه تنظیمات (مدیریت رمزها و کاربران) -->
        <div id="settings-view" class="view-section" style="display: none;">
            <button id="btnBackToDashboard" class="btn btn-secondary" style="width: auto; margin-bottom: 20px;">➔ بازگشت به داشبورد</button>
            
            <!-- تغییر رمز شخصی (همه می‌بینند) -->
            <div class="card">
                <h3>تغییر رمز عبور من</h3>
                <input type="password" id="myNewPassword" placeholder="رمز عبور جدید خود را وارد کنید..." />
                <button id="btnChangeMyPass" class="btn btn-primary">ثبت رمز جدید</button>
            </div>

            <!-- پنل مدیریت (فقط ادمین می‌بیند) -->
            <div id="admin-settings-section" style="display: none;">
                <div class="card">
                    <h2>تعریف پرسنل جدید</h2>
                    <input type="text" id="newUserName" placeholder="نام و نام خانوادگی" />
                    <input type="text" id="newUserCode" placeholder="کد پرسنلی" inputmode="numeric" />
                    <input type="password" id="newUserNatCode" placeholder="رمز اولیه" inputmode="numeric" />
                    
                    <label style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--text-muted);">
                        <input type="checkbox" id="newUserCanAssign" style="width: auto; margin: 0;">
                        این شخص بتواند برای دیگران تسک تعریف کند
                    </label>
                    
                    <button id="btnAddUser" class="btn btn-success">ثبت کاربر در سیستم</button>
                </div>
                <div class="card">
                    <h2>تغییر رمز پرسنل</h2>
                    <input type="text" id="targetUserCode" placeholder="کد پرسنلی شخص مورد نظر" inputmode="numeric" />
                    <input type="password" id="targetNewPassword" placeholder="رمز عبور جدید" />
                    <button id="btnAdminChangePass" class="btn btn-secondary">تغییر رمز کاربر</button>
                </div>
            </div>
        </div>

    </main>

    <!-- دکمه شناور (+) فقط برای مدیر نمایش داده می‌شود -->
        <button id="fabAdd" class="fab" style="display: none;">+</button>

        <!-- پنجره پاپ‌آپ ایجاد آیتم جدید -->
        <div id="addModal" class="modal-overlay">
            <div class="modal-content card">
                
                <div class="modal-header">
                    <h2>ایجاد آیتم جدید</h2>
                    <button id="btnCloseModal" class="icon-btn" style="color: var(--danger);">✕</button>
                </div>
                
                <div class="modal-tabs">
                    <button id="tabProject" class="tab-btn active">پروژه جدید</button>
                    <button id="tabTask" class="tab-btn">تسک جدید</button>
                </div>

                <!-- فرم تعریف پروژه -->
                <div id="formProject">
                    <input type="text" id="projTitle" placeholder="عنوان پروژه (مثلاً ساخت دستگاه پرس)" />
                    <textarea id="projDesc" placeholder="توضیحات و اهداف پروژه..."></textarea>
                    <button id="btnSaveProject" class="btn btn-primary">ثبت پروژه</button>
                </div>

                <!-- فرم تعریف تسک (در ابتدا مخفی است) -->
                <div id="formTask" style="display: none;">
                    <select id="taskProjectSelect">
                        <option value="" disabled selected>انتخاب پروژه مرتبط...</option>
                    </select>
                    
                    <input type="text" id="taskTitle" placeholder="عنوان کار (مثلاً خرید قطعات)" />
                    
                    <!-- این فیلدها برای کاربران عادی مخفی خواهند شد -->
                    <div id="advancedTaskOptions">
                        <select id="taskAssigneeSelect">
                            <option value="" disabled selected>مسئول انجام کار...</option>
                        </select>

                        <select id="taskFinalizerSelect">
                            <option value="" disabled selected>مسئول نهایی کردن و تایید تسک...</option>
                        </select>
                    </div>

                    <select id="taskTag">
                        <option value="" disabled selected>دسته‌بندی (تگ)...</option>
                        <option value="خرید / مالی">خرید / مالی</option>
                        <option value="فنی / ساخت">فنی / ساخت</option>
                        <option value="بررسی / تایید">بررسی / تایید</option>
                    </select>

                    <button id="btnSaveTask" class="btn btn-primary">ثبت تسک</button>
                </div>
            </div>
        </div>

    <div id="toast-container"></div>

    <script src="js/config.js"></script>
    <script src="js/db/adapter-pouch.js"></script>
    <script src="js/db/adapter-fire.js"></script>
    <script src="js/db/db-manager.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/task-logic.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
