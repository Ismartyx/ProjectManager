<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت پروژه و تسک</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- صفحه ورود -->
    <div id="login-screen" class="screen active">
        <div class="container login-container">
            <h2>ورود به سیستم</h2>
            <!-- لیست کاربران به صورت کشویی -->
            <select id="username">
                <option value="" disabled selected>انتخاب کاربر...</option>
                <option value="ali">علی</option>
                <option value="reza">رضا</option>
                <option value="sara">سارا</option>
                <option value="mohammad">محمد</option>
            </select>
            <button onclick="login()">ورود</button>
        </div>
    </div>

    <!-- داشبورد پروژه‌ها -->
    <div id="dashboard-screen" class="screen">
        <header>
            <h2>پروژه‌های من</h2>
            <div>
                <button class="icon-btn" onclick="openModal('project-modal')">➕ پروژه جدید</button>
                <button class="icon-btn" onclick="syncData()">🔄 سینک</button>
            </div>
        </header>
        <div class="container" id="project-list">
            <!-- لیست پروژه‌ها -->
        </div>
    </div>

    <!-- صفحه لیست تسک‌های یک پروژه -->
    <div id="project-details-screen" class="screen">
        <header>
            <button class="icon-btn" onclick="showScreen('dashboard-screen')">🔙 پروژه‌ها</button>
            <h2 id="current-project-title">نام پروژه</h2>
            <button class="icon-btn" onclick="openModal('task-modal')">➕ تسک جدید</button>
        </header>
        <div class="container" id="task-list">
            <!-- لیست تسک‌ها -->
        </div>
    </div>

    <!-- صفحه جزئیات تسک و گزارش‌ها -->
    <div id="task-screen" class="screen">
        <header>
            <button class="icon-btn" onclick="showScreen('project-details-screen')">🔙 تسک‌ها</button>
            <h2 id="task-title">جزئیات تسک</h2>
        </header>
        <div class="container">
            <div class="task-details">
                <div class="task-header-info">
                    <span class="tag" id="task-tag">---</span>
                    <span class="timestamp" id="task-date">---</span>
                </div>
                <p>مسئول انجام: <strong id="task-assignee">---</strong></p>
                <p>وضعیت: <strong id="task-status">---</strong></p>
                <button id="complete-btn" class="success-btn" onclick="completeTask()" disabled>✔ تایید نهایی تسک (مخصوص مسئول)</button>
            </div>
            
            <div class="reports-section">
                <h3>گزارش کارها</h3>
                <div id="reports-list"></div>
                
                <div class="add-report">
                    <textarea id="report-text" rows="3" placeholder="گزارش خود را اینجا بنویسید..."></textarea>
                    <button onclick="addReport()">ثبت گزارش</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal ساخت پروژه -->
    <div id="project-modal" class="modal">
        <div class="modal-content">
            <h3>ایجاد پروژه جدید</h3>
            <input type="text" id="new-project-title" placeholder="عنوان پروژه">
            <div class="modal-actions">
                <button onclick="addProject()">ذخیره</button>
                <button class="cancel-btn" onclick="closeModal('project-modal')">انصراف</button>
            </div>
        </div>
    </div>

    <!-- Modal ساخت تسک -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <h3>ایجاد تسک جدید</h3>
            <input type="text" id="new-task-title" placeholder="عنوان تسک">
            <select id="new-task-tag">
                <option value="فنی">فنی</option>
                <option value="خرید">خرید</option>
                <option value="اداری">اداری</option>
                <option value="عمومی">عمومی</option>
            </select>
            <select id="new-task-assignee">
                <option value="" disabled selected>انتخاب شخص مسئول...</option>
                <option value="ali">علی</option>
                <option value="reza">رضا</option>
                <option value="sara">سارا</option>
                <option value="mohammad">محمد</option>
            </select>
            <div class="modal-actions">
                <button onclick="addTask()">ذخیره تسک</button>
                <button class="cancel-btn" onclick="closeModal('task-modal')">انصراف</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
