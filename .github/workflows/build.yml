name: Build MechaveWS Apps (Android & Windows)
on:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK
        run: |
          cordova create apk_build com.mechave.ws "MechaveWS"
          rm -rf apk_build/www/*
          rsync -av --exclude='apk_build' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='dist' ./ apk_build/www/
          cd apk_build

          # کپی آیکن برنامه
          if [ -f "www/icon-512.png" ]; then
            cp www/icon-512.png icon.png
          elif [ -f "www/icon-192.png" ]; then
            cp www/icon-192.png icon.png
          fi

          # ساخت config.xml استاندارد
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("www/package.json", "utf8"));
          const version = pkg.version || "1.0.5";
          const xml = `<?xml version="1.0" encoding="utf-8"?>
          <widget id="com.mechave.ws" version="${version}" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>MechaveWS</name>
              <description>مدیریت پروژه مکاو</description>
              <author email="info@mechave.ir" href="http://mechave.ir">Mecav Workshop</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="DisallowOverscroll" value="true" />
              <preference name="KeepRunning" value="true" />
              <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />
              <preference name="AndroidWindowSplashScreenBackground" value="#0f172a" />
              <preference name="SplashScreenDelay" value="0" />
              <platform name="android">
                  <icon src="icon.png" />
                  <preference name="AndroidWindowSplashScreenAnimatedIcon" value="icon.png" />
                  <preference name="AndroidWindowSplashScreenBackground" value="#0f172a" />
              </platform>
          </widget>`;
          fs.writeFileSync("config.xml", xml.trim(), "utf8");
          '

          # نصب نسخه پایدار اندروید 13 در کوردوا
          cordova platform add android@13.0.0
          cordova plugin add cordova-plugin-android-permissions
          cordova plugin add ../cordova-plugins/mecav-notification

          # جایگزینی لوگوی ربات پیش‌فرض کوردوا با لوگوی واقعی مکاو در اسپلش اسکرین بومی اندروید
          node -e '
          const fs = require("fs");
          const xml = `<?xml version="1.0" encoding="utf-8"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item><color android:color="#0f172a" /></item><item android:gravity="center" android:width="160dp" android:height="160dp"><bitmap android:src="@drawable/mecav_splash_icon" android:gravity="center" /></item></layer-list>`;
          fs.mkdirSync("platforms/android/app/src/main/res/drawable", { recursive: true });
          fs.copyFileSync("icon.png", "platforms/android/app/src/main/res/drawable/mecav_splash_icon.png");
          fs.writeFileSync("platforms/android/app/src/main/res/drawable/ic_cdv_splashscreen.xml", xml, "utf8");
          const resDir = "platforms/android/app/src/main/res";
          fs.readdirSync(resDir).forEach(dir => {
              if (dir.startsWith("drawable")) {
                  const target = `${resDir}/${dir}/ic_cdv_splashscreen.xml`;
                  if (fs.existsSync(target)) fs.writeFileSync(target, xml, "utf8");
              }
          });
          '

          # فعال کردن مجوز ارتباط با شبکه محلی و نصاب مستقیم فایل در AndroidManifest.xml
          node -e '
          const fs = require("fs");
          const manifestPath = "platforms/android/app/src/main/AndroidManifest.xml";
          let content = fs.readFileSync(manifestPath, "utf8");
          if (!content.includes("usesCleartextTraffic")) {
              content = content.replace("<application", "<application android:usesCleartextTraffic=\"true\"");
          }
          if (!content.includes("POST_NOTIFICATIONS")) {
              content = content.replace("</manifest>", "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.VIBRATE\" />\n    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n</manifest>");
          }
          if (!content.includes("REQUEST_INSTALL_PACKAGES")) {
              content = content.replace("</manifest>", "    <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\" />\n</manifest>");
          }
          if (!content.includes("FileProvider")) {
              const providerXml = `\n        <provider android:name="androidx.core.content.FileProvider" android:authorities="com.mechave.ws.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_paths" /></provider>\n    </application>`;
              content = content.replace("</application>", providerXml);
          }
          fs.writeFileSync(manifestPath, content, "utf8");

          const xmlDir = "platforms/android/app/src/main/res/xml";
          fs.mkdirSync(xmlDir, { recursive: true });
          const pathsXml = `<?xml version="1.0" encoding="utf-8"?><paths xmlns:android="http://schemas.android.com/apk/res/android"><external-files-path name="ext_files" path="." /><external-path name="ext_path" path="." /><files-path name="int_files" path="." /><cache-path name="int_cache" path="." /></paths>`;
          fs.writeFileSync(`${xmlDir}/file_paths.xml`, pathsXml, "utf8");
          '

          # کپی کلید امضای دائمی و تنظیمات به داخل پوشه بیلد
          cp ../signing/mecav-release.keystore ./mecav-release.keystore
          cp ../build.json ./build.json

          cordova build android --release --buildConfig=build.json -- --packageType=apk

          # امضای معتبر و تضمینی با apksigner و zipalign برای رفع خطای Problem Parsing the Package
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "ZIPALIGN path: $ZIPALIGN"
          echo "APKSIGNER path: $APKSIGNER"

          RAW_APK=$(find platforms/android/app/build/outputs/apk/ -name "*release*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find platforms/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          fi
          echo "Found raw APK: $RAW_APK"

          mkdir -p signed_out
          if [ -n "$ZIPALIGN" ] && [ -x "$ZIPALIGN" ]; then
            $ZIPALIGN -f -p 4 "$RAW_APK" signed_out/aligned.apk || cp "$RAW_APK" signed_out/aligned.apk
          else
            cp "$RAW_APK" signed_out/aligned.apk
          fi

          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            echo "Signing APK with apksigner (v1, v2, v3 schemes)..."
            $APKSIGNER sign --ks mecav-release.keystore --ks-key-alias mecav --ks-pass pass:mecavworkshop --key-pass pass:mecavworkshop --out signed_out/MechaveWS.apk signed_out/aligned.apk
            echo "Verifying signature:"
            $APKSIGNER verify --verbose signed_out/MechaveWS.apk
            APK_PATH="signed_out/MechaveWS.apk"
          else
            echo "APKSIGNER not found, using raw apk"
            APK_PATH="$RAW_APK"
          fi

          # بارگذاری خودکار فایل نصبی جدید در سرور دیتابیس (مخزن ریلیزهای مجزا جهت جلوگیری از سنگین شدن دیتابیس تسک‌ها)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Deploying signed APK to CouchDB direct update repository..."
            REV=$(curl -s "http://155.117.234.69:5984/mecav_releases/app_release" | grep -o '"_rev":"[^"]*"' | head -n 1 | cut -d'"' -f4 || true)
            if [ -z "$REV" ]; then
              curl -s -X PUT "http://155.117.234.69:5984/mecav_releases/app_release" \
                -H "Content-Type: application/json" \
                -d '{"description":"MechaveWS Application Release Attachments"}'
              REV=$(curl -s "http://155.117.234.69:5984/mecav_releases/app_release" | grep -o '"_rev":"[^"]*"' | head -n 1 | cut -d'"' -f4)
            fi
            curl -s -X PUT "http://155.117.234.69:5984/mecav_releases/app_release/MechaveWS.apk?rev=$REV" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK_PATH" || true
            echo "APK deployed to mecav_releases."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MechaveWS-APK
          path: |
            apk_build/signed_out/*.apk
            apk_build/platforms/android/app/build/outputs/apk/**/*.apk

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Windows Installer
        shell: powershell
        run: |
          npx electron-builder --win --x64 --publish never 2>&1 | Out-File -FilePath electron-build.log -Encoding utf8
          Get-Content electron-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-build-log
          path: electron-build.log

      - name: Deploy Windows Setup to CouchDB
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path dist/*.exe | Select-Object -First 1
          if ($exe) {
            Write-Host "Publishing Windows Setup to CouchDB (mecav_releases)..."
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              try {
                $doc = curl.exe -s "http://155.117.234.69:5984/mecav_releases/app_release" | ConvertFrom-Json
                $rev = $doc._rev
                if (-not $rev) {
                  curl.exe -s -X PUT "http://155.117.234.69:5984/mecav_releases/app_release" -H "Content-Type: application/json" -d "{\`"description\`":\`"MechaveWS Application Release Attachments\`"}"
                  $doc = curl.exe -s "http://155.117.234.69:5984/mecav_releases/app_release" | ConvertFrom-Json
                  $rev = $doc._rev
                }
                $res = curl.exe -s -X PUT "http://155.117.234.69:5984/mecav_releases/app_release/MechaveWS-Setup.exe?rev=$rev" -H "Content-Type: application/x-msdownload" --data-binary "@$($exe.FullName)"
                Write-Host "Upload result: $res"
                if ($res -like '*"ok":true*') {
                  Write-Host "Windows Setup deployed successfully."
                  break
                } else {
                  Start-Sleep -Seconds 3
                }
              } catch {
                Write-Host "Attempt $attempt error: $_"
                Start-Sleep -Seconds 3
              }
            }
          }

          # به‌روزرسانی سند اطلاعات نسخه در هر دو مخزن دیتابیس آنلاین
          try {
            $vdoc1 = curl.exe -s "http://155.117.234.69:5984/mecav_releases/app_version_info" | ConvertFrom-Json
            $vrev1 = $vdoc1._rev
          } catch { $vrev1 = $null }
          $vdata1 = Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($vrev1) { $vdata1 | Add-Member -NotePropertyName "_rev" -NotePropertyValue $vrev1 -Force }
          $bytes1 = [System.Text.Encoding]::UTF8.GetBytes(($vdata1 | ConvertTo-Json -Compress))
          Invoke-RestMethod -Uri "http://155.117.234.69:5984/mecav_releases/app_version_info" -Method Put -Body $bytes1 -ContentType "application/json; charset=utf-8" -ErrorAction SilentlyContinue

          try {
            $vdoc2 = curl.exe -s "http://155.117.234.69:5984/mecav_db_main/app_version_info" | ConvertFrom-Json
            $vrev2 = $vdoc2._rev
          } catch { $vrev2 = $null }
          $vdata2 = Get-Content version.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($vrev2) { $vdata2 | Add-Member -NotePropertyName "_rev" -NotePropertyValue $vrev2 -Force }
          $bytes2 = [System.Text.Encoding]::UTF8.GetBytes(($vdata2 | ConvertTo-Json -Compress))
          Invoke-RestMethod -Uri "http://155.117.234.69:5984/mecav_db_main/app_version_info" -Method Put -Body $bytes2 -ContentType "application/json; charset=utf-8" -ErrorAction SilentlyContinue

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: MechaveWS-Windows-Setup
          path: dist/*.exe
